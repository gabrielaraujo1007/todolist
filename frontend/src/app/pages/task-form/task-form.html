
<main class="mx-auto my-8 w-[calc(100%-2rem)] max-w-3xl sm:my-12">
  <header class="mb-8">
    <span class="text-xs font-bold tracking-[0.12em] text-violet-700">
      ORGANIZAÇÃO PESSOAL
    </span>

    <h1 class="my-2 text-4xl font-bold tracking-tight text-gray-900 sm:text-5xl">
      {{ editando ? 'Editar tarefa' : 'Nova tarefa' }}<span class="text-violet-600">.</span>
    </h1>

    <p class="text-gray-500">
      {{ editando
        ? 'Atualize os detalhes da sua tarefa.'
        : 'Adicione uma nova tarefa à sua lista.' }}
    </p>
  </header>

  @if (loading) {
    <p class="rounded-xl border border-gray-200 bg-white p-6 text-center text-gray-500" role="status">
      Carregando tarefa...
    </p>
  } @else {
    <form
      class="flex flex-col gap-3 rounded-2xl border border-gray-200 bg-white p-4 shadow-sm sm:p-6"
      (ngSubmit)="salvar()"
    >
      <label for="title" class="mt-1 text-sm font-semibold text-gray-700">
        Título
      </label>

      <input
        id="title"
        name="title"
        [(ngModel)]="title"
        placeholder="O que você precisa fazer?"
        required
        maxlength="150"
        class="w-full rounded-lg border border-gray-300 px-3 py-3 text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-violet-600 focus:ring-2 focus:ring-violet-100"
      />

      <label for="description" class="mt-3 text-sm font-semibold text-gray-700">
        Descrição (opcional)
      </label>

      <textarea
        id="description"
        name="description"
        [(ngModel)]="description"
        placeholder="Adicione alguns detalhes..."
        rows="4"
        class="w-full resize-y rounded-lg border border-gray-300 px-3 py-3 text-gray-900 outline-none transition placeholder:text-gray-400 focus:border-violet-600 focus:ring-2 focus:ring-violet-100"
      ></textarea>

      @if (editando) {
        <label class="mt-2 flex cursor-pointer items-center gap-3 text-sm text-gray-700">
          <input
            type="checkbox"
            name="done"
            [(ngModel)]="done"
            class="h-4 w-4 accent-violet-700"
          />
          Tarefa concluída
        </label>
      }

      @if (error) {
        <p class="mt-2 rounded-lg bg-red-50 p-3 text-sm text-red-700" role="alert">
          {{ error }}
        </p>
      }

      <button
        type="submit"
        [disabled]="saving || loading || !title.trim()"
        class="mt-4 w-full rounded-lg bg-violet-700 px-4 py-3 font-semibold text-white transition hover:bg-violet-800 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ saving ? 'Salvando...' : 'Salvar tarefa' }}
      </button>

      <a
        routerLink="/tasks"
        class="rounded-lg border border-gray-200 px-4 py-3 text-center font-medium text-gray-700 transition hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-violet-500"
      >
        Cancelar e voltar
      </a>
    </form>
  }
</main>
